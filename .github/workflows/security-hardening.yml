name: Verify P1 P2 security hardening
on:
  workflow_dispatch:
  push:
    branches: [codex/nasun-security-p1-p2]
permissions:
  contents: read
concurrency:
  group: production-schema-update
  cancel-in-progress: false
jobs:
  verify-staging:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: staging-rls-fixtures
      cancel-in-progress: false
    env:
      VERIFY_SECURITY_HARDENING: 'true'
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      RLS_TEST_URL: ${{ vars.STAGING_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      RLS_TEST_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      RLS_PRODUCTION_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/apply-production-safety.mjs --staging --security
      - name: Verify real JWT access and workflow replay on isolated staging
        run: node scripts/run-staging-rls.mjs
