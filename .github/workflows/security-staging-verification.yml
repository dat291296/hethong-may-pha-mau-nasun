name: Security patch staging acceptance
on:
  push:
    branches: [codex/security-verification-20261029]
    paths: ['scripts/apply-*safety.mjs', 'scripts/run-security-hardening-rollback.mjs', 'scripts/verify-security-*', 'scripts/verify-definer-hardening-state.sql', 'scripts/run-staging-rls.mjs', 'supabase/**', '.github/workflows/security-staging-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-rls-fixtures
  cancel-in-progress: false
jobs:
  verify:
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERIFY_SECURITY_HARDENING: 'true'
      VERIFY_MACHINE_EVIDENCE: 'true'
      VERIFY_FIELD_COMMANDS: 'true'
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      RLS_TEST_URL: ${{ vars.STAGING_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      RLS_TEST_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      RLS_PRODUCTION_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure PostgreSQL client is available
        run: psql --version
      - name: Apply canonical security guards on approved staging preserving existing rows
        run: node scripts/apply-production-safety.mjs --staging --security
      - name: Exercise real JWT and transactional security fixtures
        run: node scripts/run-staging-rls.mjs
