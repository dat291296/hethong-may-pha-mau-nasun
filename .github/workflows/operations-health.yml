name: Read-only operations health
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify backup workflow freshness
        run: node scripts/verify-internal-readiness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify deployed HTTPS application and assets
        if: always()
        run: node scripts/verify-deployment.mjs https://kythuat.nasun.workers.dev
