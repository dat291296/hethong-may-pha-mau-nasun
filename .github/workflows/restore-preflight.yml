name: Read-only restore destination preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    environment: restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RESTORE_SUPABASE_URL: ${{ vars.RESTORE_SUPABASE_URL }}
      RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
      RLS_TEST_URL: ${{ vars.STAGING_SUPABASE_URL }}
      RLS_PRODUCTION_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check destination identity and empty data stores without restoring
        run: node scripts/restore-preflight.mjs
      - name: Save credential-free inspection receipt
        run: |
          mkdir -p output/stage1-evidence
          node --input-type=module -e "import{writeFileSync}from'node:fs';writeFileSync('output/stage1-evidence/restore-preflight.json',JSON.stringify({passed:true,readOnly:true,isolatedDestination:true,emptyDestination:true,fullRestoreVerified:false,commit:process.env.GITHUB_SHA},null,2))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-preflight-${{ github.run_id }}
          path: output/stage1-evidence/restore-preflight.json
          if-no-files-found: error
