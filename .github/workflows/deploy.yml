name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rls-gate:
    uses: ./.github/workflows/rls-integration.yml
    secrets: inherit

  deploy:
    needs: rls-gate
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm run test:all

      - name: Lint source
        run: npm run lint

      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate public build configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in GitHub Actions Variables."
            exit 1
          fi

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Validate Cloudflare Secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && ! grep -Eq '"account_id"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID or account_id in wrangler.jsonc."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if ! deploy_output="$(npx wrangler deploy 2>&1)"; then
            printf '%s\n' "$deploy_output"
            echo "::error::Cloudflare deployment failed. Review the Wrangler output above."
            exit 1
          fi
          printf '%s\n' "$deploy_output"
          detected_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1 || true)"
          deployment_url="${PRODUCTION_URL:-$detected_url}"
          if [ -z "$deployment_url" ]; then
            echo "::error::Could not detect deployment URL. Configure optional PRODUCTION_URL in GitHub Actions Variables."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

      - name: Verify production deployment
        run: node scripts/verify-deployment.mjs "${{ steps.deploy.outputs.url }}"

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${{ steps.deploy.outputs.url || 'not available' }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
