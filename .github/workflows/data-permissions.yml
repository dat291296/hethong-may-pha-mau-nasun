name: Stage 2 3 data and permissions acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-rls-fixtures
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 25
    env:
      VERIFY_MACHINE_EVIDENCE: 'true'
      RLS_TEST_URL: ${{ vars.STAGING_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      RLS_TEST_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      RLS_PRODUCTION_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run test:all
      - name: Verify already-installed schema and gateway with disposable staging fixtures
        run: node scripts/run-staging-rls.mjs
